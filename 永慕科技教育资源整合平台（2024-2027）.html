<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>页面升级中 · 自动重定向</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #000;
            color: #fff;
            font-family: "Microsoft YaHei", sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 20px;
        }

        /* 加载旋转动画 */
        .loader {
            width: 50px;
            height: 50px;
            border: 4px solid rgba(255, 255, 255, 0.2);
            border-left-color: #fff;
            border-radius: 50%;
            animation: rotate 1s linear infinite;
            margin-bottom: 30px;
        }

        @keyframes rotate {
            to { transform: rotate(360deg); }
        }

        .title {
            font-size: 22px;
            margin-bottom: 12px;
            font-weight: normal;
        }

        .desc {
            font-size: 16px;
            color: #ccc;
            margin-bottom: 8px;
        }

        .count {
            font-size: 14px;
            color: #999;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <div class="loader"></div>
    <h2 class="title">该网页已升级</h2>
    <p class="desc">正在为您自动重定向到最新页面...</p>
    <p class="count" id="count">3 秒后跳转</p>

    <script>
        // 自动跳转目标地址
        const targetUrl = "https://gaokao.yongmukeji.top";
        let count = 3;
        const countEl = document.getElementById("count");

        // 倒计时
        const timer = setInterval(() => {
            count--;
            countEl.textContent = count + " 秒后跳转";
            if (count <= 0) {
                clearInterval(timer);
                window.location.href = targetUrl;
            }
        }, 1000);

        // 同时立即开始跳转（防止倒计时失效）
        setTimeout(() => {
            window.location.href = targetUrl;
        }, 3000);
    </script>
</body>
</html>
